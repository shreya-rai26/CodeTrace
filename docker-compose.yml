# Start everything:  docker compose up --build     then open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codetrace
      POSTGRES_PASSWORD: ${DB_PASSWORD:-codetrace}
      POSTGRES_DB: codetrace
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # Power BI Desktop connects to localhost:5433; remove on a public server
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codetrace"]
      interval: 5s
      retries: 10

  ml:
    build: ./ml-service
    environment:
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-tfidf}

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://codetrace:${DB_PASSWORD:-codetrace}@db:5432/codetrace
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file next to docker-compose.yml}
      ML_SERVICE_URL: http://ml:8000
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      db: { condition: service_healthy }
      ml: { condition: service_started }

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on: [backend]

volumes:
  dbdata:
